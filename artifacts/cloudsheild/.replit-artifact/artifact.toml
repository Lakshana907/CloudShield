kind = "web"
previewPath = "/"
title = "CloudShield"
description = "A secure cloud project room for teams to create projects, share files, and collaborate using TL-issued reference keys."
version = "1.0.0"
id = "artifacts/cloudsheild"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23866

[services.development]
run = "pnpm --filter @workspace/cloudshield run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cloudshield", "run", "build" ]
serve = "static"
publicDir = "artifacts/cloudsheild/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23866"
BASE_PATH = "/"
