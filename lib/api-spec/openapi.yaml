openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project rooms, memberships, and shared files
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [projects]
      summary: Get the signed-in user's project summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects available to the current user
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/join:
    post:
      operationId: joinProject
      tags: [projects]
      summary: Join a project room using a TL-issued reference key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinProjectInput"
      responses:
        "200":
          description: Project joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project room
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /projects/{projectId}/files:
    get:
      operationId: listProjectFiles
      tags: [projects]
      summary: List shared project files
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectFile"
    post:
      operationId: createProjectFile
      tags: [projects]
      summary: Record a file uploaded to a project room
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFileInput"
      responses:
        "201":
          description: File recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a private object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    DashboardSummary:
      type: object
      required: [projectCount, fileCount, sharedWithMeCount, recentActivity]
      properties:
        projectCount:
          type: integer
        fileCount:
          type: integer
        sharedWithMeCount:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    Activity:
      type: object
      required: [id, type, title, detail, occurredAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [project_created, member_joined, file_uploaded]
        title:
          type: string
        detail:
          type: string
        occurredAt:
          type: string
          format: date-time
    Project:
      type: object
      required: [id, companyName, title, tlName, referenceKey, role, memberCount, filesCount, createdAt]
      properties:
        id:
          type: string
        companyName:
          type: string
        title:
          type: string
        tlName:
          type: string
        referenceKey:
          type: string
        role:
          type: string
          enum: [tl, member]
        memberCount:
          type: integer
        filesCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    ProjectInput:
      type: object
      required: [companyName, title, tlName]
      properties:
        companyName:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        tlName:
          type: string
          minLength: 1
    JoinProjectInput:
      type: object
      required: [companyName, person, projectTitle, referenceKey]
      properties:
        companyName:
          type: string
          minLength: 1
        person:
          type: string
          minLength: 1
        projectTitle:
          type: string
          minLength: 1
        referenceKey:
          type: string
          minLength: 1
    ProjectFile:
      type: object
      required: [id, projectId, name, size, contentType, objectPath, uploadedBy, uploadedByRole, uploadedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
        objectPath:
          type: string
        uploadedBy:
          type: string
        uploadedByRole:
          type: string
          enum: [tl, member]
        uploadedAt:
          type: string
          format: date-time
    ProjectFileInput:
      type: object
      required: [name, size, contentType, objectPath]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 1
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

